mlkit-objects = { module = "com.google.mlkit:object-detection", version.ref = "mlkitObjectDetection" }
mlkit-image-labeling = { module = "com.google.mlkit:image-labeling", version.ref = "mlkitImageLabeling" }

play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
mapbox = { module = "com.mapbox.maps:android", version.ref = "mapbox" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutinesPlayServices" }

material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIcons" }
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabase-storage = { module = "io.github.jan-tennert.supabase:storage-kt" }
